# =============================================
# 小A智能问答系统 — Nginx 配置文件
# 部署服务器: 1.95.49.216
# =============================================

upstream fastapi_backend {
    server 127.0.0.1:8000;
    # 可扩展多个 worker
    # server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name 1.95.49.216;

    # 日志
    access_log /var/log/nginx/xiaoA_access.log;
    error_log  /var/log/nginx/xiaoA_error.log;

    # 客户端上传限制
    client_max_body_size 10M;

    # ====== 静态资源（Vue3 SPA） ======
    location / {
        root /opt/xiaoA-qa/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ====== API 反向代理到 FastAPI ======
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # RAG 流式响应可能较长
    }

    # ====== WebSocket 流式接口 ======
    location /api/stream {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # 流式输出超时 5 分钟
        proxy_buffering off;       # 关闭缓冲，实时转发
    }

    # ====== 健康检查 ======
    location /health {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
}